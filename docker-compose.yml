x-base: &base
  logging:
    driver: "json-file"
    options:
      max-size: "${MAX_LOG_FILE_SIZE:-10m}"
      max-file: "${MAX_LOG_FILE_COUNT:-3}"
      tag: "{{.Name}}|{{.ImageName}}|{{.ID}}"

services:
  postgres:
    <<: *base
    image: postgres:${POSTGRES_VERSION:-18.6}
    container_name: postgres
    restart: unless-stopped

    environment:
      # Keep values and defaults in sync with DATABASE_URL in the litellm service
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpass4litellm}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  litellm-init:
    <<: *base
    image: docker.litellm.ai/berriai/litellm:${LITELLM_VERSION:-latest}
    container_name: litellm-init
    restart: no
    entrypoint: ["/bin/sh", "-c"]

    volumes:
      - ./litellm_config:/source:ro
      - litellm-config:/config

    command:
      - |
        {
          echo "include:"
          echo "  - /source/base.yaml"
          for f in /source/credentials/*.yaml; do
            [ -f "$$f" ] || continue
            echo "  - $$f"
          done
          for f in /source/models/*.yaml; do
            [ -f "$$f" ] || continue
            echo "  - $$f"
          done
        } > /config/litellm_config.yaml
        cat /config/litellm_config.yaml

  litellm:
    <<: *base
    image: docker.litellm.ai/berriai/litellm:${LITELLM_VERSION:-latest}
    container_name: litellm
    restart: unless-stopped

    ports:
      - "${LITELLM_BIND_ADDRESS:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"

    environment:
      # Keep POSTGRES_* values and defaults in sync with the postgres service
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-pgpass4litellm}@postgres:5432/${POSTGRES_DB:-litellm}

    env_file:
      - .env

    volumes:
      - ./litellm_config:/source:ro
      - litellm-config:/config:ro

    command:
      - "--config"
      - "/config/litellm_config.yaml"
      - "--port"
      - "4000"

    depends_on:
      litellm-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  litellm-config:
  postgres-data:
